# 新增参数时请同步补充中文注释，保持部署配置可读。

# 当前机器人实例名称。新增机器人时复制本配置并修改 robot_name / xml_path / 关节顺序等字段
robot_name: go2

# 训练导出的策略文件，部署时默认加载这个权重
policy_path: models/go2/policy_1.pt
# MuJoCo 使用包含 Go2 的 ROBOCON 场景；平地对照可通过 --xml-path 指定 scene_flat.xml
xml_path: resources/robots/go2/ROBOCON2027.xml

# 仿真总时长 [s]
simulation_duration: 60.0
# 仿真步长 [s]
simulation_dt: 0.002
# 一个动作持续多少个仿真步
control_decimation: 10

# 动作维度，Go2 为 12 个关节
num_actions: 12
# 单帧观测维度，必须和训练侧保持一致；45 维不直接输入机身线速度
num_one_step_obs: 45
# 历史观测帧数，当前 HIM 策略使用 6 帧
history_length: 6
# policy 输入维度，必须和训练侧保持一致；45*6=270
num_obs: 270
# 训练 critic 的单帧特权观测维度：45 + base_lin_vel3 + 外力3 + 高度187；部署 actor 不使用
num_one_step_privileged_obs: 238
# 训练 critic 输入维度；部署侧只用于配置对齐和检查，不输入部署 policy
num_privileged_obs: 238
# 观测模式：6 帧 45 维历史观测，当前 estimator+actor 导出模型也必须保持这个外部输入
obs_mode: quadruped_history_45x6

# 关节顺序必须和模型输出、Mujoco 模型一致
joint_names:
  - FL_hip_joint
  - FL_thigh_joint
  - FL_calf_joint
  - FR_hip_joint
  - FR_thigh_joint
  - FR_calf_joint
  - RL_hip_joint
  - RL_thigh_joint
  - RL_calf_joint
  - RR_hip_joint
  - RR_thigh_joint
  - RR_calf_joint

# 执行器名称顺序
actuator_names:
  - FL_hip
  - FL_thigh
  - FL_calf
  - FR_hip
  - FR_thigh
  - FR_calf
  - RL_hip
  - RL_thigh
  - RL_calf
  - RR_hip
  - RR_thigh
  - RR_calf

# 每个关节的 PD 比例增益，和当前训练侧安全基线一致
kps:
  - 20.0
  - 20.0
  - 20.0
  - 20.0
  - 20.0
  - 20.0
  - 20.0
  - 20.0
  - 20.0
  - 20.0
  - 20.0
  - 20.0

# 每个关节的 PD 微分增益，和当前训练侧安全基线一致
kds:
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5
  - 0.5

# action=0 时的默认关节角目标 [rad]
default_angles:
  - 0.1
  - 0.8
  - -1.5
  - -0.1
  - 0.8
  - -1.5
  - 0.1
  - 1.0
  - -1.5
  - -0.1
  - 1.0
  - -1.5

# 策略动作映射到关节角偏移的缩放
action_scale: 0.25
# policy 观测裁剪上限，必须和训练侧 normalization.clip_observations 保持一致
clip_observations: 100.0
# policy 动作裁剪上限，必须和训练侧 normalization.clip_actions 保持一致；当前训练侧为 100
clip_actions: 100.0

# 初始速度命令 [vx, vy, yaw_rate]
command_init:
  - 0.5
  - 0.0
  - 0.0

# 速度命令上限 [vx, vy, yaw_rate]
command_limits:
  - 1.0
  - 1.0
  - 1.0
# 平面合成速度上限 [m/s]，与训练 commands.max_translation_speed 一致；各档同比缩放
max_translation_speed: 1.0

# 观测里命令量的缩放系数
command_scale:
  - 2.0
  - 2.0
  - 0.25

# 当前 Linux 主机键盘的 evdev 映射；内置键盘和外接键盘使用相同规则
keyboard:
  bindings:
    forward: KEY_W
    backward: KEY_S
    left: KEY_A
    right: KEY_D
    turn_left: KEY_Q
    turn_right: KEY_E
    stop: KEY_SPACE
    enable: KEY_F
    disable: KEY_I
    speed_low: KEY_1
    speed_medium: KEY_2
    speed_high: KEY_3
    reset_sim: KEY_R
    print_status: KEY_P
  # 低速、中速和高速分别占 command_limits 的比例
  speed_levels:
    - 0.25
    - 0.5
    - 1.0
  # 启动时使用中速档；键盘控制本身仍需按 F 使能
  default_speed_level: 2

# 跌倒判定阈值：机身高度；设置为 0 或负数表示禁用高度检查
fall_height_threshold: 0.0
# 跌倒判定阈值：重力方向投影
fall_gravity_z_threshold: -0.2

# 观测缩放系数；单帧 45 维观测不使用机身线速度，保留 lin_vel 仅用于和训练配置命名对齐
obs_scale_lin_vel: 2.0
obs_scale_ang_vel: 0.25
obs_scale_dof_pos: 1.0
obs_scale_dof_vel: 0.05

# 初始机身位姿
initial_base_pos:
  - 0.0
  - 0.0
  - 0.42

# 初始机身姿态四元数
initial_base_quat:
  - 1.0
  - 0.0
  - 0.0
  - 0.0
